<med-tabs class="max-w-lg">
  <med-tab header="Account">
    <p class="p-3 text-sm text-surface-600 dark:text-surface-300">Manage your account details and preferences.</p>
  </med-tab>
  <med-tab header="Notifications">
    <p class="p-3 text-sm text-surface-600 dark:text-surface-300">Choose which updates you want to hear about.</p>
  </med-tab>
  <med-tab header="Billing" [disabled]="true">
    <p class="p-3 text-sm text-surface-600 dark:text-surface-300">Billing is only available on paid plans.</p>
  </med-tab>
</med-tabs>
