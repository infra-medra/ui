<med-autocomplete
  [suggestions]="suggestions()"
  [(ngModel)]="framework"
  [showClear]="true"
  placeholder="Search a framework"
  (search)="onSearch($event)"
  (optionSelected)="record('optionSelected: ' + $event.label)"
  (inputFocus)="record('inputFocus')"
  (inputBlur)="record('inputBlur')"
  (cleared)="record('cleared')"
  (panelShow)="record('panelShow')"
  (panelHide)="record('panelHide')"
/>
<ul class="mt-2 text-sm text-surface-500 dark:text-surface-400">
  @for (entry of log(); track $index) {
    <li>{{ entry }}</li>
  }
</ul>
