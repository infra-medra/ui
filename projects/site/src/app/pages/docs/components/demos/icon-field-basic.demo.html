<div class="flex flex-wrap gap-4">
  <med-icon-field>
    <med-icon name="envelope" medIconFieldIcon />
    <input medInputText type="email" placeholder="Email" class="w-56 pl-9" [(ngModel)]="email" />
  </med-icon-field>

  <med-icon-field>
    <med-icon name="eye" medIconFieldIcon position="right" />
    <input medInputText type="password" placeholder="Password" class="w-56 pr-9" [(ngModel)]="password" />
  </med-icon-field>
</div>
