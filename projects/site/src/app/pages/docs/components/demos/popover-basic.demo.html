<button medButton variant="outlined" #trigger (click)="pop.toggle(trigger)">Share</button>

<med-popover #pop ariaLabel="Share this page">
  <div class="flex flex-col gap-2">
    <p class="text-sm font-medium text-surface-700 dark:text-surface-200">Share this page</p>
    <input medInputText #link readonly value="https://medra.dev/docs/components/popover" class="w-64" />
    <button medButton type="button" size="sm" (click)="pop.close()">Done</button>
  </div>
</med-popover>
