<med-multi-select [options]="cities" [formControl]="selectedCities" [invalid]="selectedCities.invalid && selectedCities.touched" showClear placeholder="Pick cities" class="max-w-xs" />
<p class="mt-2 text-sm text-surface-500 dark:text-surface-400">Selected: {{ selectedCities.value.join(', ') || 'none' }} · {{ selectedCities.valid ? 'valid' : 'required' }}</p>
