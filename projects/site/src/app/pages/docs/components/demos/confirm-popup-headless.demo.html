<div class="flex flex-col items-start gap-3">
  <button medButton #trigger variant="outlined" (click)="confirmHeadless(trigger)">Move to Archive</button>
  <p class="text-sm text-surface-500 dark:text-surface-400">{{ result() }}</p>
</div>

<ng-template #headlessTpl let-data let-onAccept="onAccept" let-onReject="onReject">
  <div class="flex flex-col gap-2">
    <p class="text-sm font-semibold text-surface-900 dark:text-surface-50">Move this to Archive?</p>
    <p class="text-xs text-surface-500">{{ data.message }}</p>
    <div class="flex justify-end gap-2">
      <button medButton type="button" size="sm" variant="text" (click)="onReject()">Cancel</button>
      <button medButton type="button" size="sm" (click)="onAccept()">Archive</button>
    </div>
  </div>
</ng-template>
