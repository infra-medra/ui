<med-input-number
  [formControl]="quantityControl"
  [invalid]="quantityControl.invalid && quantityControl.touched"
  showClear
  class="max-w-xs"
/>
<p class="mt-2 text-sm text-surface-500 dark:text-surface-400">
  Value: {{ quantityControl.value ?? 'none' }} · {{ quantityControl.valid ? 'valid' : 'required' }}
</p>
