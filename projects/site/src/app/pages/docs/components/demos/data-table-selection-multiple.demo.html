<med-data-table
  [value]="equipment"
  selectionMode="multiple"
  dataKey="id"
  [filterable]="true"
  filterPlaceholder="Search inventory"
  [(selection)]="selected"
  ariaLabel="Lab equipment inventory (multiple selection)"
>
  <med-table-column field="name" header="Name" />
  <med-table-column field="category" header="Category" />
  <med-table-column field="quantity" header="Quantity" align="right" />
</med-data-table>
<p class="mt-2 text-sm text-surface-500 dark:text-surface-400">
  {{ selectedCount }} of {{ equipment.length }} rows selected. The header checkbox selects every row that matches the search.
</p>
