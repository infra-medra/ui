<div class="mb-3 flex justify-end">
  <button
    type="button"
    class="rounded-md border border-surface-300 px-3 py-1.5 text-sm text-surface-700 hover:bg-surface-50 dark:border-surface-600 dark:text-surface-200 dark:hover:bg-surface-800"
    (click)="toggleLayout()"
  >
    Switch to {{ layout() === 'list' ? 'grid' : 'list' }} view
  </button>
</div>
<med-data-view [value]="recipes" [layout]="layout()" [paginator]="true" [rows]="4">
  <ng-template #item let-recipe>
    <div class="flex flex-col gap-1 p-3">
      <span class="font-display text-surface-900 dark:text-surface-50">{{ recipe.title }}</span>
      <span class="text-sm text-surface-500 dark:text-surface-400">{{ recipe.cuisine }} · {{ recipe.minutes }} min</span>
    </div>
  </ng-template>
</med-data-view>
