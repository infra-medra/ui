<div class="grid grid-cols-2 gap-10 sm:grid-cols-4">
  <div class="flex h-32 items-end justify-center">
    <med-speed-dial direction="up" [items]="items" />
  </div>
  <div class="flex h-32 items-start justify-center">
    <med-speed-dial direction="down" [items]="items" />
  </div>
  <div class="flex h-32 items-center justify-start">
    <med-speed-dial direction="right" [items]="items" />
  </div>
  <div class="flex h-32 items-center justify-end">
    <med-speed-dial direction="left" [items]="items" />
  </div>
</div>
