<med-listbox [options]="cities" [(ngModel)]="selectedCities" [multiple]="true" toggleAllLabel="All cities" (selectAllChanged)="lastToggle = $event.checked ? 'all selected' : 'all cleared'" class="max-w-xs" ariaLabel="Cities" />
<p class="mt-2 text-sm text-surface-500 dark:text-surface-400">Last toggle-all: {{ lastToggle }}</p>
