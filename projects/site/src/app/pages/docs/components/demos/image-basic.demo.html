<div class="flex flex-wrap items-start gap-6">
  <med-image [src]="sceneImage" alt="Illustration of a sun over mountains" class="h-40 w-64 rounded-lg object-cover" />
  <med-image
    [src]="sceneImage"
    alt="Illustration of a sun over mountains"
    preview
    (opened)="previewState.set('Preview opened.')"
    (closed)="previewState.set('Preview closed.')"
    class="h-40 w-64 rounded-lg object-cover"
  />
  <med-image [src]="brokenImage" alt="Team photo" (imageError)="errorState.set('imageError fired.')" class="h-40 w-64 rounded-lg" />
</div>
<p class="mt-2 text-sm text-surface-500 dark:text-surface-400">{{ previewState() }} {{ errorState() }}</p>
