<div class="flex flex-col items-start gap-3">
  <button medButton #trigger variant="outlined" (click)="confirmLeave(trigger)">Leave page</button>
  <p class="text-sm text-surface-500 dark:text-surface-400">{{ result() }}</p>
</div>

<ng-template #contentTpl let-data>
  <div class="flex items-start gap-2">
    <med-icon name="exclamation-triangle" variant="solid" class="size-5 shrink-0 text-warn-500" />
    <p class="text-sm">You have unsaved changes. This replaces just the icon+message block — the Accept/Reject buttons below are still the built-in ones.</p>
  </div>
</ng-template>
