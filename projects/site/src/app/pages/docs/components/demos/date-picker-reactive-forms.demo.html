<med-date-picker
  [formControl]="dateControl"
  [invalid]="dateControl.invalid && dateControl.touched"
  showClear
  class="max-w-xs"
/>
<p class="mt-2 text-sm text-surface-500 dark:text-surface-400">
  Selected: {{ dateControl.value ? dateControl.value.toLocaleDateString('en-US') : 'none' }} · {{ dateControl.valid ? 'valid' : 'required' }}
</p>
