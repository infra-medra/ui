<med-data-table [value]="equipment" [resizableColumns]="true" (colResize)="onResize($event)" ariaLabel="Lab equipment inventory (resizable columns)">
  <med-table-column field="name" header="Name" />
  <med-table-column field="category" header="Category" />
  <med-table-column field="quantity" header="Quantity" align="right" />
</med-data-table>
<p class="mt-2 text-sm text-surface-500 dark:text-surface-400">Last resize: {{ lastResize }}</p>
