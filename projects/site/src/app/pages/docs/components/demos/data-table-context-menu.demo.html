<span #cm="medContextMenu" [medContextMenu]="menuItems" (itemSelect)="onMenuItemSelect($event)"></span>
<med-data-table
  [value]="equipment"
  dataKey="id"
  [contextMenu]="cm"
  [(contextMenuSelection)]="selectedRow"
  ariaLabel="Lab equipment inventory (context menu)"
>
  <med-table-column field="name" header="Name" />
  <med-table-column field="category" header="Category" />
  <med-table-column field="quantity" header="Quantity" align="right" />
</med-data-table>
<p class="mt-2 text-sm text-surface-500 dark:text-surface-400">{{ lastAction() }}</p>
