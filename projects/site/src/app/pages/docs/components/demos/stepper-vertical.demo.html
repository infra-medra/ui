<med-stepper class="max-w-lg" orientation="vertical" [linear]="true">
  <med-step-panel label="Account">
    <p class="text-sm text-surface-600 dark:text-surface-300">Choose a username and password.</p>
  </med-step-panel>
  <med-step-panel label="Profile">
    <p class="text-sm text-surface-600 dark:text-surface-300">Tell us a bit about yourself.</p>
  </med-step-panel>
  <med-step-panel label="Review">
    <p class="text-sm text-surface-600 dark:text-surface-300">Everything looks good — submit when ready.</p>
  </med-step-panel>
</med-stepper>
