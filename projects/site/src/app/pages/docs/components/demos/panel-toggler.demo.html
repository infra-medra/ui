<div class="flex max-w-sm flex-col gap-4">
  <med-panel header="Icon-only toggler, start-aligned" toggleable toggler="icon" iconPos="start" [(collapsed)]="collapsed">
    <p>Clicking the header row itself does nothing now — only the chevron toggles.</p>
  </med-panel>

  <div class="flex flex-col gap-2">
    <button medButton type="button" variant="outlined" size="sm" (click)="headerless.set(!headerless())">
      {{ headerless() ? 'Show header' : 'Hide header' }}
    </button>
    <med-panel header="This header can disappear" [showHeader]="!headerless()">
      <p>The body stays put either way — only the title row is gone.</p>
    </med-panel>
  </div>
</div>
