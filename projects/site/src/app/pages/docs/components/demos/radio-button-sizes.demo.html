<div class="flex flex-wrap items-center gap-6">
  <label class="flex items-center gap-2 text-sm text-surface-900 dark:text-surface-50">
    <med-radio-button name="size" value="sm" [(ngModel)]="size" size="sm" />
    Small
  </label>
  <label class="flex items-center gap-2 text-sm text-surface-900 dark:text-surface-50">
    <med-radio-button name="size" value="default" [(ngModel)]="size" />
    Normal
  </label>
  <label class="flex items-center gap-2 text-sm text-surface-900 dark:text-surface-50">
    <med-radio-button name="size" value="lg" [(ngModel)]="size" size="lg" />
    Large
  </label>
</div>
