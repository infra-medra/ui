<med-multi-select [options]="cities" [(ngModel)]="selectedCities" [showClear]="true" placeholder="Pick cities" class="max-w-xs">
  <ng-template #triggerIcon><span data-testid="trigger-icon-template" aria-hidden="true">▾</span></ng-template>
  <ng-template #clearIcon><span data-testid="clear-icon-template" aria-hidden="true">✕</span></ng-template>
</med-multi-select>
