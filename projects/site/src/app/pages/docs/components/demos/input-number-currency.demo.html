<div class="grid gap-4 sm:grid-cols-3 max-w-2xl">
  <div>
    <label class="mb-1 block text-xs font-medium text-surface-600 dark:text-surface-300">USD (en-US)</label>
    <med-input-number [(ngModel)]="usd" mode="currency" currency="USD" locale="en-US" />
  </div>
  <div>
    <label class="mb-1 block text-xs font-medium text-surface-600 dark:text-surface-300">EUR (de-DE)</label>
    <med-input-number [(ngModel)]="eur" mode="currency" currency="EUR" locale="de-DE" />
  </div>
  <div>
    <label class="mb-1 block text-xs font-medium text-surface-600 dark:text-surface-300">JPY (code)</label>
    <med-input-number [(ngModel)]="jpy" mode="currency" currency="JPY" currencyDisplay="code" locale="ja-JP" />
  </div>
</div>
<p class="mt-2 text-sm text-surface-500 dark:text-surface-400">Value: {{ usd ?? 'none' }}</p>
