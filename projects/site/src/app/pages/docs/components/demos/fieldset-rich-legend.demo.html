<div class="flex max-w-sm flex-col gap-3">
  <med-fieldset legend="Fallback text (unused here)" toggleable [(collapsed)]="collapsed" (beforeToggle)="onBeforeToggle($event)" (afterToggle)="onAfterToggle($event)">
    <span medFieldsetLegend class="flex items-center gap-1.5">
      <med-icon name="credit-card" class="size-4" />
      Payment details
    </span>
    <div class="flex flex-col gap-2">
      <input medInputText placeholder="Card number" />
      <input medInputText placeholder="Expiry" />
    </div>
  </med-fieldset>
  @if (log().length) {
    <ul class="space-y-1 text-sm text-surface-500 dark:text-surface-400">
      @for (line of log(); track $index) {
        <li>{{ line }}</li>
      }
    </ul>
  }
</div>
