<div class="flex flex-wrap items-center gap-6">
  <label class="flex items-center gap-2 text-sm text-surface-900 dark:text-surface-50">
    <med-checkbox size="sm" />
    Small
  </label>
  <label class="flex items-center gap-2 text-sm text-surface-900 dark:text-surface-50">
    <med-checkbox size="lg" />
    Large
  </label>
  <label class="flex items-center gap-2 text-sm text-surface-900 dark:text-surface-50">
    <med-checkbox indeterminate />
    Indeterminate
  </label>
  <label class="flex items-center gap-2 text-sm text-surface-900 dark:text-surface-50">
    <med-checkbox invalid />
    Invalid
  </label>
  <label class="flex items-center gap-2 text-sm text-surface-500 dark:text-surface-400">
    <med-checkbox disabled />
    Disabled
  </label>
  <label class="flex items-center gap-2 text-sm text-surface-900 dark:text-surface-50">
    <med-checkbox [(ngModel)]="readonlyChecked" readonly />
    Readonly
  </label>
</div>
