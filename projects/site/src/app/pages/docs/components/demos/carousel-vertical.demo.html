<med-carousel
  [value]="tools"
  orientation="vertical"
  [numVisible]="2"
  verticalViewPortHeight="20rem"
  (pageChange)="page.set($event)"
  ariaLabel="Workshop tools"
  class="max-w-sm"
>
  <ng-template #header>
    <p class="mb-2 text-sm font-semibold text-surface-700 dark:text-surface-200">Featured tools</p>
  </ng-template>
  <ng-template #item let-tool>
    <div class="mx-2 flex flex-col gap-1 rounded-lg border border-surface-200 p-4 dark:border-surface-700">
      <span class="text-xs font-medium text-brand-600 dark:text-brand-400">{{ tool.category }}</span>
      <span class="font-display text-base text-surface-900 dark:text-surface-50">{{ tool.name }}</span>
      <span class="text-sm text-surface-500 dark:text-surface-400">{{ tool.priceLabel }}</span>
    </div>
  </ng-template>
  <ng-template #footer>
    <p class="mt-2 text-sm text-surface-500 dark:text-surface-400">Page {{ page() + 1 }}</p>
  </ng-template>
</med-carousel>
