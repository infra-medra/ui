<med-splitter class="h-56 max-w-lg rounded-lg border border-surface-200 dark:border-surface-700">
  <med-splitter-panel [minSize]="10" [maxSize]="40" collapsible class="flex items-center justify-center bg-surface-50 dark:bg-surface-900">
    <p class="text-sm text-surface-500 dark:text-surface-400">Sidebar (max 40%, double-click gutter to collapse)</p>
  </med-splitter-panel>
  <med-splitter-gutter />
  <med-splitter-panel [minSize]="20" class="flex items-center justify-center">
    <p class="text-sm text-surface-500 dark:text-surface-400">Main content</p>
  </med-splitter-panel>
</med-splitter>
