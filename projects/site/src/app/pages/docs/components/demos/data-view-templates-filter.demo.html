<med-data-view [value]="recipes" [filterPredicate]="filterPredicate" filterPlaceholder="Search recipes" paginator [rows]="3" [rowsPerPageOptions]="[3, 6]">
  <ng-template #header>
    <p class="mb-2 text-sm font-semibold text-surface-700 dark:text-surface-200">Weeknight recipes</p>
  </ng-template>
  <ng-template #item let-recipe>
    <div class="flex flex-col gap-1 p-3">
      <span class="font-display text-surface-900 dark:text-surface-50">{{ recipe.title }}</span>
      <span class="text-sm text-surface-500 dark:text-surface-400">{{ recipe.cuisine }} · {{ recipe.minutes }} min</span>
    </div>
  </ng-template>
  <ng-template #empty>
    <p class="p-3 text-sm text-surface-500 dark:text-surface-400">No recipes match that search.</p>
  </ng-template>
  <ng-template #footer>
    <p class="mt-2 text-sm text-surface-500 dark:text-surface-400">{{ recipes.length }} recipes total</p>
  </ng-template>
</med-data-view>
