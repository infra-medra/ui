<textarea
  medTextarea
  [formControl]="summaryControl"
  [invalid]="summaryControl.invalid && summaryControl.touched"
  rows="3"
  placeholder="Release summary"
  class="w-72"
></textarea>
<p class="mt-2 text-sm text-surface-500 dark:text-surface-400">
  Value: {{ summaryControl.value || '(empty)' }} · {{ summaryControl.valid ? 'valid' : 'required' }}
</p>
