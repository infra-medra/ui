<div class="flex flex-wrap items-center gap-6">
  <label class="flex items-center gap-2 text-sm text-surface-900 dark:text-surface-50">
    <med-checkbox [(ngModel)]="small" size="sm" name="size-sm" />
    Small
  </label>
  <label class="flex items-center gap-2 text-sm text-surface-900 dark:text-surface-50">
    <med-checkbox [(ngModel)]="normal" name="size-default" />
    Normal
  </label>
  <label class="flex items-center gap-2 text-sm text-surface-900 dark:text-surface-50">
    <med-checkbox [(ngModel)]="large" size="lg" name="size-lg" />
    Large
  </label>
</div>
