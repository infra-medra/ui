<div class="grid gap-4 sm:grid-cols-2 max-w-xl">
  <div>
    <label class="mb-1 block text-xs font-medium text-surface-600 dark:text-surface-300">Without Grouping</label>
    <med-input-number [(ngModel)]="integer" [useGrouping]="false" />
  </div>
  <div>
    <label class="mb-1 block text-xs font-medium text-surface-600 dark:text-surface-300">Grouping</label>
    <med-input-number [(ngModel)]="grouping" [useGrouping]="true" />
  </div>
  <div>
    <label class="mb-1 block text-xs font-medium text-surface-600 dark:text-surface-300">Min-Max Fraction Digits</label>
    <med-input-number [(ngModel)]="minMaxFraction" [minFractionDigits]="2" [maxFractionDigits]="5" />
  </div>
  <div>
    <label class="mb-1 block text-xs font-medium text-surface-600 dark:text-surface-300">Min-Max (0–100)</label>
    <med-input-number [(ngModel)]="bounded" [min]="0" [max]="100" />
  </div>
</div>
