<med-pick-list
  [(source)]="available"
  [(target)]="assigned"
  [filterPredicate]="filterPredicate"
  [itemDisabled]="itemDisabled"
  keepSelection
  sourceHeader="Available reviewers"
  targetHeader="Assigned reviewers"
  (moveToTarget)="onMoveToTarget($event)"
  (moveToSource)="onMoveToSource($event)"
>
  <ng-template let-reviewer>
    <div class="flex flex-col">
      <span>{{ reviewer.name }}{{ reviewer.onLeave ? ' (on leave)' : '' }}</span>
      <span class="text-xs text-surface-400 dark:text-surface-500">{{ reviewer.expertise }}</span>
    </div>
  </ng-template>
</med-pick-list>
<p class="mt-2 text-sm text-surface-500 dark:text-surface-400">{{ lastTransfer() }}</p>
