<med-data-table
  [value]="equipment"
  selectionMode="single"
  dataKey="id"
  [(selection)]="selected"
  ariaLabel="Lab equipment inventory (keyboard navigation)"
>
  <med-table-column field="name" header="Name" />
  <med-table-column field="category" header="Category" />
  <med-table-column field="quantity" header="Quantity" align="right" />
</med-data-table>
<p class="mt-2 text-sm text-surface-500 dark:text-surface-400">
  Focus a row, then use ArrowUp, ArrowDown, Home and End to move between rows.
</p>
