<med-toolbar ariaLabel="Document actions" class="max-w-lg">
  <div medToolbarStart class="flex gap-2">
    <button medButton variant="text" severity="secondary" size="sm">New</button>
    <button medButton variant="text" severity="secondary" size="sm">Open</button>
  </div>
  <div medToolbarCenter>
    <p class="text-sm font-medium text-surface-700 dark:text-surface-200">Untitled document</p>

    <button medButton severity="primary" size="sm">Share</button>
  </div>
</med-toolbar>
