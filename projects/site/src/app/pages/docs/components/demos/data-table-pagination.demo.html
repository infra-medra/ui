<med-data-table
  [value]="equipment"
  [paginator]="true"
  [rows]="3"
  [rowsPerPageOptions]="[3, 5, 8]"
  [(first)]="first"
  ariaLabel="Lab equipment inventory (paginated)"
>
  <med-table-column field="name" header="Name" />
  <med-table-column field="category" header="Category" />
  <med-table-column field="quantity" header="Quantity" align="right" />
</med-data-table>
<p class="mt-2 text-sm text-surface-500 dark:text-surface-400">First visible row index: {{ first }}</p>
