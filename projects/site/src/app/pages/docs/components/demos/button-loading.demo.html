<div class="flex flex-wrap items-center gap-3">
  <button medButton [loading]="loading()" (click)="load()">
    @if (loading()) {
      <med-progress-spinner size="sm" class="text-current" />
    } @else {
      <med-icon name="check" variant="mini" class="size-4" />
    }
    <span>Search</span>
  </button>
</div>
