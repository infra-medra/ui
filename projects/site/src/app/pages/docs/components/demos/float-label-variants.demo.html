<div class="flex flex-wrap items-start gap-6">
  <med-float-label variant="on">
    <input medInputText id="float-on" placeholder=" " class="peer w-48" [(ngModel)]="onValue" />
    <label medFloatLabelText for="float-on">On border</label>
  </med-float-label>
  <med-float-label variant="over">
    <input medInputText id="float-over" placeholder=" " class="peer w-48" [(ngModel)]="overValue" />
    <label medFloatLabelText for="float-over">Over field</label>
  </med-float-label>
  <med-float-label variant="in">
    <input medInputText id="float-in" placeholder=" " class="peer w-48" [(ngModel)]="inValue" />
    <label medFloatLabelText for="float-in">Inside field</label>
  </med-float-label>
</div>
