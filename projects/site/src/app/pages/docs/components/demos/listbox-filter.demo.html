<med-listbox [options]="cities" [(ngModel)]="selectedCities" [multiple]="true" filter filterMatchMode="startsWith" class="max-w-xs" ariaLabel="Cities" (filtered)="lastFilter = $event.filter" />
<p class="mt-2 text-sm text-surface-500 dark:text-surface-400">Last filter: {{ lastFilter || 'none' }}</p>
