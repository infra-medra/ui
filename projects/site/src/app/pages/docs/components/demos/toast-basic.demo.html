<div class="flex flex-wrap gap-3">
  <button medButton severity="info" variant="outlined" (click)="toastService.info('Export started.')">Info toast</button>
  <button medButton severity="success" variant="outlined" (click)="toastService.success('Export complete.')">Success toast</button>
  <button medButton severity="danger" variant="outlined" (click)="toastService.error('Export failed.')">Error toast</button>
</div>
