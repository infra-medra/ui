<med-cascade-select [options]="catalog" [(ngModel)]="item" placeholder="Pick a product">
  <ng-template #value let-value let-path="path">
    <span data-testid="value-template" class="font-medium">{{ path.at(-1) }} <span class="text-surface-400">({{ value }})</span></span>
  </ng-template>
</med-cascade-select>
