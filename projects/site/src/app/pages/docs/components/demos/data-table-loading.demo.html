<div class="flex flex-col gap-3">
  <div class="flex justify-end">
    <button medButton type="button" variant="outlined" size="sm" (click)="loading = !loading">
      {{ loading ? 'Stop loading' : 'Start loading' }}
    </button>
  </div>
  <med-data-table [value]="equipment" [loading]="loading" loadingLabel="Loading equipment" ariaLabel="Lab equipment inventory (loading)">
    <med-table-column field="name" header="Name" />
    <med-table-column field="category" header="Category" />
    <med-table-column field="quantity" header="Quantity" align="right" />
  </med-data-table>
</div>
