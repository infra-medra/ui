<med-select-button
  [options]="planOptions"
  [formControl]="planControl"
  [invalid]="planControl.invalid && planControl.touched"
  ariaLabel="Plan"
/>
<p class="mt-2 text-sm text-surface-500 dark:text-surface-400">
  Value: {{ planControl.value ?? 'none' }} · {{ planControl.valid ? 'valid' : 'required' }}
</p>
