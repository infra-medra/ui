<div class="flex max-w-sm flex-col gap-3">
  <div class="flex gap-2">
    <button medButton type="button" variant="outlined" size="sm" (click)="scrollToTop()">Scroll to top</button>
    <button medButton type="button" variant="outlined" size="sm" (click)="scrollToBottom()">Scroll to bottom</button>
  </div>
  <med-scroll-panel class="h-40 rounded-lg border border-surface-200 p-4 dark:border-surface-700" ariaLabel="Lines">
    <div class="flex flex-col gap-2 text-sm text-surface-600 dark:text-surface-300">
      @for (entry of entries; track entry) {
        <p>{{ entry }}</p>
      }
    </div>
  </med-scroll-panel>
</div>
