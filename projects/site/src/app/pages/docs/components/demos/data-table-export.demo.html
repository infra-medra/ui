<div class="flex flex-col gap-3">
  <div class="flex justify-end">
    <button medButton type="button" variant="outlined" size="sm" (click)="dt.exportCSV()">Export CSV</button>
  </div>
  <med-data-table #dt [value]="equipment" exportFilename="lab-equipment" ariaLabel="Lab equipment inventory">
    <med-table-column field="name" header="Name" />
    <med-table-column field="category" header="Category" />
    <med-table-column field="quantity" header="Quantity" align="right" />
  </med-data-table>
</div>
