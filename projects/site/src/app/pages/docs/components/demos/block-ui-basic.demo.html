<div class="flex max-w-sm flex-col gap-3">
  <med-block-ui [blocked]="saving()" class="rounded-lg border border-surface-200 p-4 dark:border-surface-700">
    <div class="flex flex-col gap-2">
      <input medInputText placeholder="Full name" />
      <input medInputText placeholder="E-mail" />
    </div>
  </med-block-ui>
  <button medButton type="button" variant="outlined" (click)="save()">{{ saving() ? 'Saving…' : 'Save' }}</button>
</div>
