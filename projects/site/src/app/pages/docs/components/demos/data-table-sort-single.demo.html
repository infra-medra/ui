<med-data-table
  [value]="equipment"
  sortField="quantity"
  sortOrder="desc"
  (sort)="onSort($event)"
  ariaLabel="Lab equipment inventory (single sort)"
>
  <med-table-column field="name" header="Name" sortable />
  <med-table-column field="category" header="Category" sortable />
  <med-table-column field="quantity" header="Quantity" align="right" sortable />
</med-data-table>
<p class="mt-2 text-sm text-surface-500 dark:text-surface-400">Last sort event: {{ lastSort }}</p>
