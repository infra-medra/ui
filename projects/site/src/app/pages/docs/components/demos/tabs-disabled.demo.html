<med-tabs class="max-w-lg">
  <med-tab header="Profile">
    <p class="p-3 text-sm text-surface-600 dark:text-surface-300">Update your display name and contact email.</p>
  </med-tab>
  <med-tab header="Billing" [disabled]="true">
    <p class="p-3 text-sm text-surface-600 dark:text-surface-300">Billing settings are restricted for this role.</p>
  </med-tab>
  <med-tab header="Notifications">
    <p class="p-3 text-sm text-surface-600 dark:text-surface-300">Choose how you receive activity alerts.</p>
  </med-tab>
</med-tabs>
