<med-data-table [value]="equipment" [resizableColumns]="true" ariaLabel="Lab equipment inventory (horizontal scroll)">
  <med-table-column field="name" header="Name" width="220px" />
  <med-table-column field="category" header="Category" width="220px" />
  <med-table-column field="location" header="Location" width="200px" />
  <med-table-column field="supplier" header="Supplier" width="220px" />
  <med-table-column field="serial" header="Serial number" width="220px" />
  <med-table-column field="quantity" header="Quantity" width="160px" align="right" />
</med-data-table>
