<med-data-table [value]="[]" ariaLabel="Lab equipment inventory (custom empty template)">
  <med-table-column field="name" header="Name" />
  <med-table-column field="category" header="Category" />
  <med-table-column field="quantity" header="Quantity" align="right" />
  <ng-template #empty>
    <div class="flex flex-col items-center gap-1 py-2">
      <p class="font-medium text-surface-700 dark:text-surface-200">No equipment registered</p>
      <p class="text-xs text-surface-500 dark:text-surface-400">Add an item or clear active filters to populate the table.</p>
    </div>
  </ng-template>
</med-data-table>
