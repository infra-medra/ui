<med-scroll-panel class="h-40 max-w-sm rounded-lg border border-surface-200 p-4 dark:border-surface-700" ariaLabel="Changelog">
  <div class="flex flex-col gap-3 text-sm text-surface-600 dark:text-surface-300">
    @for (entry of entries; track entry) {
      <p>{{ entry }}</p>
    }
  </div>
</med-scroll-panel>
