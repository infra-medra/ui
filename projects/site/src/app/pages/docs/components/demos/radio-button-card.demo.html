<div class="flex flex-col gap-3">
  <div class="grid gap-3 sm:grid-cols-3">
    @for (plan of plans; track plan.id) {
      <label
        class="flex cursor-pointer items-start gap-3 rounded-lg border p-4 transition-colors"
        [class]="
          selectedPlan === plan.name
            ? 'border-brand-500 bg-brand-50/50 dark:border-brand-400 dark:bg-brand-950/30'
            : 'border-surface-200 bg-surface-0 hover:border-surface-300 dark:border-surface-700 dark:bg-surface-900 dark:hover:border-surface-600'
        "
      >
        <med-radio-button
          [inputId]="'card-' + plan.id"
          [value]="plan.name"
          [(ngModel)]="selectedPlan"
          name="card-plan"
        />
        <span class="flex flex-1 flex-col gap-1">
          <span class="flex items-center justify-between gap-2 text-sm font-medium text-surface-900 dark:text-surface-50">
            <span>{{ plan.name }}</span>
            <span class="text-brand-600 dark:text-brand-400">{{ plan.price }}</span>
          </span>
          <span class="text-xs text-surface-500 dark:text-surface-400">{{ plan.description }}</span>
        </span>
      </label>
    }
  </div>
  <p class="text-sm text-surface-500 dark:text-surface-400">Selected: {{ selectedPlan }}</p>
</div>
