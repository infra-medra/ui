<div class="flex flex-wrap items-start gap-8">
  <div>
    <med-date-picker [(ngModel)]="holidays" selectionMode="multiple" showClear class="max-w-xs" />
    <p class="mt-2 text-sm text-surface-500 dark:text-surface-400">{{ holidays.length }} date(s) selected</p>
  </div>
  <div>
    <med-date-picker [(ngModel)]="billingMonth" view="month" showClear class="max-w-xs" />
    <p class="mt-2 text-sm text-surface-500 dark:text-surface-400">
      {{ billingMonth ? billingMonth.toLocaleDateString(undefined, { month: 'long', year: 'numeric' }) : 'none' }}
    </p>
  </div>
</div>
