<med-select
  [options]="countries"
  optionLabel="name"
  optionValue="code"
  optionDisabled="closed"
  optionGroupLabel="country"
  optionGroupChildren="cities"
  [(ngModel)]="city"
  placeholder="Pick a city"
  class="max-w-xs"
/>
<p class="mt-2 text-sm text-surface-500 dark:text-surface-400">Selected: {{ city ?? 'none' }}</p>
