<med-pick-list [(source)]="available" [(target)]="assigned" sourceHeader="Available reviewers" targetHeader="Assigned reviewers">
  <ng-template let-reviewer>
    <div class="flex flex-col">
      <span>{{ reviewer.name }}</span>
      <span class="text-xs text-surface-400 dark:text-surface-500">{{ reviewer.expertise }}</span>
    </div>
  </ng-template>
</med-pick-list>
